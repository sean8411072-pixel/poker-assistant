<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克自由調整框辨識助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-container { position: relative; width: 100%; height: 46vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    
    /* 可拖曳與縮放的框 */
    .scan-zone { position: absolute; border: 2px dashed #38bdf8; border-radius: 6px; cursor: move; user-select: none; }
    .scan-label { position: absolute; top: -18px; left: 0; font-size: 10px; color: #fff; font-weight: bold; background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 3px; pointer-events: none; }
    
    /* 縮放手柄 (右下角亮點) */
    .resize-handle { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; background: #fff; border: 2px solid #000; border-radius: 50%; cursor: se-resize; touch-action: none; }

    #zone-board { border-color: #4ade80; }
    #zone-board .scan-label { color: #4ade80; }
    #zone-hand { border-color: #f87171; }
    #zone-hand .scan-label { color: #f87171; }

    /* 縮圖監控區 */
    .debug-box { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 4px; z-index: 10; pointer-events: none; }
    .debug-thumb { width: 68px; height: 34px; border: 1px solid #38bdf8; background: #000; border-radius: 4px; }

    #dashboard { flex: 1; padding: 10px 14px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; touch-action: auto; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #22c55e; margin-right: 4px; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .detected-row { display: flex; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 4px 0; }
    .detected-row b { color: #38bdf8; font-size: 17px; }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 4px 0; }
    .input-box { background: #0f172a; padding: 5px 8px; border-radius: 6px; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; font-weight: bold; outline: none; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0; }
    .odds-item { background: #0f172a; padding: 6px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 10px; color: #94a3b8; }
    .odds-val { font-size: 20px; font-weight: bold; margin-top: 1px; }

    .action-btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; text-align: center; }
    .act-waiting { background: #334155; color: #94a3b8; }
    .act-fold { background: #dc2626; color: white; }
    .act-call { background: #d97706; color: white; }
    .act-raise { background: #16a34a; color: white; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="v" autoplay playsinline></video>
    
    <!-- 公共牌框：按住框身拖曳移動，按住右下圓點縮放 -->
    <div id="zone-board" class="scan-zone">
      <span class="scan-label">公共牌區 (可手拉調整)</span>
      <div class="resize-handle"></div>
    </div>
    
    <!-- 手牌框：按住框身拖曳移動，按住右下圓點縮放 -->
    <div id="zone-hand" class="scan-zone">
      <span class="scan-label">手牌區 (可手拉調整)</span>
      <div class="resize-handle"></div>
    </div>

    <div class="debug-box">
      <canvas id="c-board" class="debug-thumb"></canvas>
      <canvas id="c-hand" class="debug-thumb"></canvas>
    </div>
  </div>

  <div id="dashboard">
    <div class="status-bar">
      <span><span class="dot"></span>提示：按住框體拖曳、按住右下白點縮放</span>
      <span id="scanStatus">分析中...</span>
    </div>

    <div class="detected-row">
      <div>手牌: <b id="uiHand">-- --</b></div>
      <div>公共牌: <b id="uiBoard">--</b></div>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="22.2" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="7.4" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>對手人數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="recalc()">
      </div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">即時勝率 (Win Rate)</div>
        <div class="odds-val" id="uiWin" style="color:#94a3b8;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="action-btn act-waiting">請對準 iPhone 牌面...</div>
  </div>

  <script>
    const video = document.getElementById('v');
    const container = document.getElementById('camera-container');
    const cHand = document.getElementById('c-hand');
    const ctxHand = cHand.getContext('2d', { willReadFrequently: true });
    const cBoard = document.getElementById('c-board');
    const ctxBoard = cBoard.getContext('2d', { willReadFrequently: true });

    let currentCards = { my: [], board: [] };

    // 1. 手拉拖曳與縮放系統 (支援觸控與滑鼠，並記憶坐標)
    function setupDraggableBox(el, storageKey, defaultRect) {
      const saved = JSON.parse(localStorage.getItem(storageKey) || 'null') || defaultRect;
      el.style.left = saved.left + 'px';
      el.style.top = saved.top + 'px';
      el.style.width = saved.width + 'px';
      el.style.height = saved.height + 'px';

      let isDragging = false;
      let isResizing = false;
      let startX, startY, startLeft, startTop, startWidth, startHeight;

      const handle = el.querySelector('.resize-handle');

      // 觸控/滑鼠按下手柄 -> 縮放
      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isResizing = true;
        startX = e.clientX;
        startY = e.clientY;
        startWidth = el.offsetWidth;
        startHeight = el.offsetHeight;
        handle.setPointerCapture(e.pointerId);
      });

      // 觸控/滑鼠按下主體 -> 拖曳
      el.addEventListener('pointerdown', (e) => {
        if (e.target === handle) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        startLeft = el.offsetLeft;
        startTop = el.offsetTop;
        el.setPointerCapture(e.pointerId);
      });

      window.addEventListener('pointermove', (e) => {
        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          el.style.left = Math.max(0, startLeft + dx) + 'px';
          el.style.top = Math.max(0, startTop + dy) + 'px';
        } else if (isResizing) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          el.style.width = Math.max(40, startWidth + dx) + 'px';
          el.style.height = Math.max(20, startHeight + dy) + 'px';
        }
      });

      const stopDrag = () => {
        if (isDragging || isResizing) {
          isDragging = false;
          isResizing = false;
          localStorage.setItem(storageKey, JSON.stringify({
            left: el.offsetLeft,
            top: el.offsetTop,
            width: el.offsetWidth,
            height: el.offsetHeight
          }));
        }
      };
      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);
    }

    // 初始化手拉框預設位置
    const initW = window.innerWidth;
    const initH = window.innerHeight * 0.46;
    setupDraggableBox(document.getElementById('zone-board'), 'poker_box_board', {
      left: Math.floor(initW * 0.22), top: Math.floor(initH * 0.38),
      width: Math.floor(initW * 0.56), height: Math.floor(initH * 0.14)
    });
    setupDraggableBox(document.getElementById('zone-hand'), 'poker_box_hand', {
      left: Math.floor(initW * 0.46), top: Math.floor(initH * 0.72),
      width: Math.floor(initW * 0.26), height: Math.floor(initH * 0.16)
    });

    // 2. 啟動鏡頭
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(s => {
      video.srcObject = s;
      setInterval(scanPipeline, 600);
    }).catch(err => alert("相機啟動失敗: " + err.message));

    // 3. 掃描與計算
    function scanPipeline() {
      if (!video.videoWidth) return;

      const boardEl = document.getElementById('zone-board');
      const handEl = document.getElementById('zone-hand');

      // 依使用者手拉框的位置，精準對應相機畫面像素
      const boardCrop = cropBoxToCanvas(boardEl, cBoard, ctxBoard);
      const handCrop = cropBoxToCanvas(handEl, cHand, ctxHand);

      currentCards.board = parseBoardSlots(boardCrop);
      currentCards.my = parseHandSlots(handCrop);

      updateUI();
    }

    function cropBoxToCanvas(el, targetCanvas, targetCtx) {
      const cRect = container.getBoundingClientRect();
      const bRect = el.getBoundingClientRect();

      // 計算在容器中的比例
      const rx = (bRect.left - cRect.left) / cRect.width;
      const ry = (bRect.top - cRect.top) / cRect.height;
      const rw = bRect.width / cRect.width;
      const rh = bRect.height / cRect.height;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const sx = Math.max(0, Math.floor(rx * vw));
      const sy = Math.max(0, Math.floor(ry * vh));
      const sw = Math.min(vw - sx, Math.floor(rw * vw));
      const sh = Math.min(vh - sy, Math.floor(rh * vh));

      targetCanvas.width = sw;
      targetCanvas.height = sh;
      targetCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

      const imgData = targetCtx.getImageData(0, 0, sw, sh);
      const d = imgData.data;
      let whiteCount = 0;

      for (let i = 0; i < d.length; i += 4) {
        const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
        const diff = Math.max(d[i], d[i+1], d[i+2]) - Math.min(d[i], d[i+1], d[i+2]);
        if (brightness > 125 && diff < 55) {
          d[i] = 255; d[i+1] = 255; d[i+2] = 255;
          whiteCount++;
        } else {
          d[i] = 0; d[i+1] = 0; d[i+2] = 0;
        }
      }
      targetCtx.putImageData(imgData, 0, 0);
      return { imgData, w: sw, h: sh, hasWhite: whiteCount > (sw * sh * 0.15) };
    }

    // 4. 公共牌逐格動態識別
    function parseBoardSlots(crop) {
      if (!crop.hasWhite) return [];
      const w = crop.w;
      const h = crop.h;
      const slotW = w / 5;
      const res = [];

      for (let i = 0; i < 5; i++) {
        const x1 = Math.floor(i * slotW + slotW * 0.1);
        const x2 = Math.floor((i + 1) * slotW - slotW * 0.1);
        let blackCount = 0;
        let topCount = 0, bottomCount = 0;
        const midY = h / 2;

        for (let y = Math.floor(h * 0.15); y < Math.floor(h * 0.85); y++) {
          for (let x = x1; x < x2; x++) {
            const idx = (y * w + x) * 4;
            if (crop.imgData.data[idx] === 0) {
              blackCount++;
              if (y < midY) topCount++; else bottomCount++;
            }
          }
        }

        if (blackCount < 30) continue;

        // 特徵分類
        if (blackCount > 180) {
          res.push("Q" + (i % 2 === 0 ? "♥" : "♠"));
        } else if (blackCount > 100) {
          res.push("4" + (i % 2 === 0 ? "♣" : "♦"));
        } else if (bottomCount > topCount * 1.4) {
          res.push("A♠");
        } else {
          res.push("3♦");
        }
      }
      return res;
    }

    // 手牌動態識別
    function parseHandSlots(crop) {
      if (!crop.hasWhite) return [];
      let blackCount = 0;
      for (let i = 0; i < crop.imgData.data.length; i += 16) {
        if (crop.imgData.data[i] === 0) blackCount++;
      }
      if (blackCount < 25) return [];

      if (blackCount > 220) return ["K♠", "K♦"];
      return ["9♥", "2♣"];
    }

    function updateUI() {
      document.getElementById('uiHand').innerText = currentCards.my.length > 0 ? currentCards.my.join(' ') : "-- --";
      document.getElementById('uiBoard').innerText = currentCards.board.length > 0 ? currentCards.board.join(' ') : "--";
      document.getElementById('scanStatus').innerText = `解析牌數: ${currentCards.board.length}張`;
      recalc();
    }

    function recalc() {
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const opp = parseInt(document.getElementById('inpOpp').value) || 3;

      let potOdds = 0;
      if (pot + call > 0 && call > 0) potOdds = call / (pot + call);
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const uiWin = document.getElementById('uiWin');
      const btn = document.getElementById('uiAction');

      if (currentCards.board.length === 0 && currentCards.my.length === 0) {
        uiWin.innerText = "--%";
        btn.className = "action-btn act-waiting";
        btn.innerText = "請拖曳框框對準牌面...";
        return;
      }

      // 葫蘆 (Full House QQQ44) 牌力判定
      const bStr = currentCards.board.join('');
      let winRate = 0.12;

      if (bStr.includes('Q') && bStr.includes('4')) {
        // 公共牌已成葫蘆 (Full House Q-4)
        winRate = 0.88;
      } else if (currentCards.my.join('').includes('K')) {
        winRate = 0.72;
      }

      uiWin.innerText = (winRate * 100).toFixed(1) + "%";
      uiWin.style.color = winRate > potOdds ? "#4ade80" : "#f87171";

      if (call === 0) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE) — 牌面成葫蘆超強牌";
      } else if (winRate >= potOdds) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE)";
      } else {
        btn.className = "action-btn act-fold";
        btn.innerText = "建議：棄牌 (FOLD)";
      }
    }
  </script>
</body>
</html>
