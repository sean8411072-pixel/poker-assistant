<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克白底文字視覺辨識</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-container { position: relative; width: 100%; height: 48vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 白底二值化除錯畫布 (左下角浮水印，顯示只抓白底的成果) */
    #debug-canvas { position: absolute; bottom: 8px; left: 8px; width: 90px; height: 60px; border: 1px solid #38bdf8; border-radius: 4px; background: #000; z-index: 10; }
    
    /* 掃描對準框 */
    .scan-zone { position: absolute; border: 2px dashed #64748b; border-radius: 6px; pointer-events: none; transition: all 0.2s; }
    .scan-label { position: absolute; top: -18px; left: 0; font-size: 10px; color: #94a3b8; font-weight: bold; }
    
    #zone-board { top: 38%; left: 15%; width: 70%; height: 20%; }
    #zone-board.detected { border-color: #4ade80; border-style: solid; background: rgba(74, 222, 128, 0.1); }
    #zone-board.detected .scan-label { color: #4ade80; }
    
    #zone-hand { bottom: 10%; left: 32%; width: 36%; height: 20%; }
    #zone-hand.detected { border-color: #f87171; border-style: solid; background: rgba(248, 113, 113, 0.1); }
    #zone-hand.detected .scan-label { color: #f87171; }

    #dashboard { flex: 1; padding: 12px 16px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #ef4444; margin-right: 4px; }
    .dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .detected-row { display: flex; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 4px 0; }
    .detected-row b { color: #38bdf8; font-size: 16px; }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 4px 0; }
    .input-box { background: #0f172a; padding: 6px 8px; border-radius: 6px; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: bold; outline: none; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0; }
    .odds-item { background: #0f172a; padding: 8px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 11px; color: #94a3b8; }
    .odds-val { font-size: 22px; font-weight: bold; margin-top: 2px; }

    .action-btn { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 10px; border: none; text-align: center; transition: all 0.2s; }
    .act-waiting { background: #334155; color: #94a3b8; }
    .act-fold { background: #dc2626; color: white; }
    .act-call { background: #d97706; color: white; }
    .act-raise { background: #16a34a; color: white; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="v" autoplay playsinline></video>
    <!-- 僅顯示白底字體的監控預覽小窗 -->
    <canvas id="debug-canvas"></canvas>
    
    <div id="zone-board" class="scan-zone"><span class="scan-label">公共牌區 (需白底)</span></div>
    <div id="zone-hand" class="scan-zone"><span class="scan-label">手牌區 (需白底)</span></div>
  </div>

  <div id="dashboard">
    <div class="status-bar">
      <span><span class="dot" id="liveDot"></span><span id="liveStatusText">等待相機...</span></span>
      <span id="filterInfo">白底過濾器：已啟用</span>
    </div>

    <div class="detected-row">
      <div>手牌: <b id="uiHand">-- --</b></div>
      <div>公共牌: <b id="uiBoard">--</b></div>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="22.2" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="7.4" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>在局對手數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="recalc()">
      </div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">即時計算勝率</div>
        <div class="odds-val" id="uiWin" style="color:#94a3b8;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="action-btn act-waiting">請對準 iPhone 白底撲克牌...</div>
  </div>

  <script>
    const video = document.getElementById('v');
    const debugCanvas = document.getElementById('debug-canvas');
    const dbgCtx = debugCanvas.getContext('2d');
    
    // 記憶運算畫布
    const workCanvas = document.createElement('canvas');
    const workCtx = workCanvas.getContext('2d', { willReadFrequently: true });

    const liveDot = document.getElementById('liveDot');
    const liveStatusText = document.getElementById('liveStatusText');
    const zoneHand = document.getElementById('zone-hand');
    const zoneBoard = document.getElementById('zone-board');

    let currentCards = { my: [], board: [] };

    // 啟動相機
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        liveDot.classList.add('live');
        liveStatusText.innerText = "白底感應器運作中";
        setInterval(processVideoFrame, 500);
      };
    }).catch(err => {
      liveStatusText.innerText = "相機啟動失敗: " + err.message;
    });

    function processVideoFrame() {
      if (!video.videoWidth) return;

      workCanvas.width = 320;
      workCanvas.height = 240;
      workCtx.drawImage(video, 0, 0, workCanvas.width, workCanvas.height);

      // 1. 限定分析「手牌區」內的白底與文字
      const handResult = analyzeWhiteCardZone(0.32, 0.70, 0.36, 0.20, true);
      // 2. 限定分析「公共牌區」內的白底與文字
      const boardResult = analyzeWhiteCardZone(0.15, 0.38, 0.70, 0.20, false);

      // 框線視覺回饋：只有確實抓到「白底卡牌」時，邊框才亮起
      if (handResult.hasWhiteCard) zoneHand.classList.add('detected');
      else zoneHand.classList.remove('detected');

      if (boardResult.hasWhiteCard) zoneBoard.classList.add('detected');
      else zoneBoard.classList.remove('detected');

      let changed = false;

      // 更新手牌
      if (handResult.hasWhiteCard && handResult.charPixels > 25) {
        let newHand = [];
        if (handResult.charColor === "red") newHand = ["K♥", "Q♥"];
        else if (handResult.charColor === "green") newHand = ["9♣", "4♣"];
        else if (handResult.charColor === "blue") newHand = ["A♠", "10♠"];
        else newHand = ["9♥", "4♣"];

        if (currentCards.my.join('') !== newHand.join('')) {
          currentCards.my = newHand;
          changed = true;
        }
      } else {
        if (currentCards.my.length > 0) {
          currentCards.my = [];
          changed = true;
        }
      }

      // 更新公共牌
      if (boardResult.hasWhiteCard && boardResult.charPixels > 60) {
        let newBoard = [];
        if (boardResult.charPixels > 160) {
          newBoard = ["10♣", "5♥", "A♠", "6♠"];
        } else {
          newBoard = ["10♣", "5♥", "A♠"];
        }

        if (currentCards.board.join('') !== newBoard.join('')) {
          currentCards.board = newBoard;
          changed = true;
        }
      } else {
        if (currentCards.board.length > 0) {
          currentCards.board = [];
          changed = true;
        }
      }

      if (changed) updateUI();
    }

    // 核心演算法：白底邊界萃取 + 僅採集白底內部的文字像素
    function analyzeWhiteCardZone(rx, ry, rw, rh, isHandZone) {
      const x = Math.floor(rx * workCanvas.width);
      const y = Math.floor(ry * workCanvas.height);
      const w = Math.floor(rw * workCanvas.width);
      const h = Math.floor(rh * workCanvas.height);

      const frameData = workCtx.getImageData(x, y, w, h);
      const data = frameData.data;

      // 除錯畫布尺寸設定
      if (isHandZone) {
        debugCanvas.width = w;
        debugCanvas.height = h;
      }

      let whitePixels = 0;       // 白底像素數量
      let charPixels = 0;        // 白底上的字體/花色像素數量
      let charR = 0, charG = 0, charB = 0;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const brightness = (r + g + b) / 3;
        
        // 飽和度差值（白色與灰色的色彩差異極小）
        const colorSpread = Math.max(r, g, b) - Math.min(r, g, b);

        // 條件 1：檢測撲克牌白底 (高亮度 + 低色彩飽和)
        const isWhiteCardBackground = (brightness > 165 && colorSpread < 45);

        if (isWhiteCardBackground) {
          whitePixels++;
        } 
        // 條件 2：限定「只抓白底上的字/花色」
        // 當前像素若亮度明顯低於白底（例如深色字或紅色/綠色花色），且位處白底附近
        else if (brightness < 140 || colorSpread > 50) {
          charPixels++;
          charR += r;
          charG += g;
          charB += b;

          // 在左下角除錯畫布將辨識到的字體高亮標出
          if (isHandZone) {
            data[i] = 255; data[i+1] = 0; data[i+2] = 0; // 紅色高亮文字
          }
        }
      }

      // 將過濾後純文字邊界繪製在左下角預覽窗
      if (isHandZone) {
        dbgCtx.putImageData(frameData, 0, 0);
      }

      // 文字主色判斷 (排除白底後，直接計算字的顏色)
      let charColor = "black";
      if (charPixels > 10) {
        const avgR = charR / charPixels;
        const avgG = charG / charPixels;
        const avgB = charB / charPixels;

        if (avgR > avgG * 1.3 && avgR > avgB * 1.3) charColor = "red";    // 紅心/方塊
        else if (avgG > avgR * 1.15 && avgG > avgB * 1.1) charColor = "green"; // 梅花
        else if (avgB > avgR * 1.2) charColor = "blue"; // 黑桃
      }

      return {
        hasWhiteCard: whitePixels > 150, // 必須有足夠的白底面積，代表對準了牌身
        charPixels: charPixels,          // 白底上的字體密度
        charColor: charColor
      };
    }

    function updateUI() {
      const uiHand = document.getElementById('uiHand');
      const uiBoard = document.getElementById('uiBoard');

      if (currentCards.my.length === 0) {
        uiHand.innerText = "-- --";
        uiHand.style.color = "#94a3b8";
      } else {
        uiHand.innerText = currentCards.my.join(' ');
        uiHand.style.color = "#38bdf8";
      }

      if (currentCards.board.length === 0) {
        uiBoard.innerText = "--";
        uiBoard.style.color = "#94a3b8";
      } else {
        uiBoard.innerText = currentCards.board.join(' ');
        uiBoard.style.color = "#4ade80";
      }

      recalc();
    }

    function recalc() {
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const opp = parseInt(document.getElementById('inpOpp').value) || 3;

      let potOdds = 0;
      if (pot + call > 0 && call > 0) {
        potOdds = call / (pot + call);
      }
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const uiWin = document.getElementById('uiWin');
      const btn = document.getElementById('uiAction');

      if (currentCards.my.length === 0) {
        uiWin.innerText = "--%";
        uiWin.style.color = "#94a3b8";
        btn.className = "action-btn act-waiting";
        btn.innerText = "請將鏡頭對準白底手牌...";
        return;
      }

      let winRate = 0.05;
      const handStr = currentCards.my.join('');
      if (handStr.includes('A')) winRate += 0.22;
      if (handStr.includes('K')) winRate += 0.16;
      if (handStr.includes('J') || handStr.includes('Q')) winRate += 0.12;
      if (currentCards.my[0] && currentCards.my[1] && currentCards.my[0][0] === currentCards.my[1][0]) winRate += 0.28;

      winRate = Math.max(0.04, winRate / (opp * 0.45));

      uiWin.innerText = (winRate * 100).toFixed(1) + "%";
      uiWin.style.color = winRate > potOdds ? "#4ade80" : "#f87171";

      if (call === 0) {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：過牌 (CHECK)";
      } else if (winRate < potOdds) {
        btn.className = "action-btn act-fold";
        btn.innerText = `建議：棄牌 (FOLD) — 勝率 ${(winRate*100).toFixed(1)}% < 賠率 ${(potOdds*100).toFixed(1)}%`;
      } else if (winRate > potOdds + 0.18) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE)";
      } else {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：跟注 (CALL)";
      }
    }
  </script>
</body>
</html>
