<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克即時自動辨識助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-box { position: relative; width: 100%; height: 48vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas { display: none; }
    
    .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px dashed rgba(34, 197, 94, 0.7); width: 88%; height: 78%; border-radius: 12px; pointer-events: none; }
    .crosshair-text { position: absolute; top: 8px; left: 12px; font-size: 11px; color: #4ade80; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 4px; }
    
    /* 閃爍指示燈 (監控中) */
    .live-indicator { position: absolute; top: 12px; right: 12px; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 20px; font-size: 11px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
    .dot.active { background: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }

    #dashboard { flex: 1; padding: 12px 16px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    .api-row { display: flex; gap: 8px; margin-bottom: 6px; }
    .api-row input { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 12px; }
    
    .status-badge { font-size: 13px; color: #94a3b8; text-align: center; min-height: 18px; }
    
    .card-info { display: flex; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 8px; font-size: 14px; margin: 4px 0; }
    .card-info b { color: #38bdf8; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0; }
    .odds-item { background: #334155; padding: 8px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 11px; color: #94a3b8; }
    .odds-val { font-size: 20px; font-weight: bold; margin-top: 2px; }

    .action-btn { width: 100%; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 10px; border: none; cursor: pointer; text-align: center; }
    .btn-start { background: #16a34a; color: #fff; }
    .btn-stop { background: #dc2626; color: #fff; }
    
    .recommend-box { text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 17px; }
    .action-fold { background: #dc2626; color: white; }
    .action-call { background: #d97706; color: white; }
    .action-raise { background: #16a34a; color: white; }
  </style>
</head>
<body>

  <!-- 1. 鏡頭即時畫面 -->
  <div id="camera-box">
    <video id="v" autoplay playsinline></video>
    <canvas id="c"></canvas>
    <div class="crosshair">
      <span class="crosshair-text">對準 iPhone 牌桌</span>
    </div>
    <div class="live-indicator">
      <div class="dot" id="liveDot"></div>
      <span id="liveText">待機中</span>
    </div>
  </div>

  <!-- 2. 即時儀表板 -->
  <div id="dashboard">
    <div class="api-row">
      <input type="password" id="apiKey" placeholder="貼上 API Key (初次使用需輸入)" />
    </div>

    <div class="status-badge" id="statusText">請架好手機，點擊下方「啟動即時自動監控」</div>

    <div class="card-info">
      <div>手牌: <b id="uiHand">--</b></div>
      <div>公共牌: <b id="uiBoard">--</b></div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">勝率 (Win Rate)</div>
        <div class="odds-val" id="uiWin" style="color:#f87171;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="recommend-box action-fold" style="display:none;">建議：--</div>

    <button id="btnToggle" class="action-btn btn-start" onclick="toggleAutoMonitor()">▶ 啟動即時自動監控</button>
  </div>

  <script>
    const video = document.getElementById('v');
    const canvas = document.getElementById('c');
    const apiKeyInput = document.getElementById('apiKey');
    const statusText = document.getElementById('statusText');
    const liveDot = document.getElementById('liveDot');
    const liveText = document.getElementById('liveText');
    const btnToggle = document.getElementById('btnToggle');

    let isMonitoring = false;
    let isProcessing = false;
    let timerId = null;

    if (localStorage.getItem('poker_api_key')) {
      apiKeyInput.value = localStorage.getItem('poker_api_key');
    }

    // 啟動相機
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 960 }, height: { ideal: 540 } },
      audio: false
    }).then(s => video.srcObject = s).catch(e => {
      statusText.innerText = "相機啟動失敗：" + e.message;
      statusText.style.color = "#f87171";
    });

    // 開關自動監控循環
    function toggleAutoMonitor() {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) { alert("請先填寫 API Key！"); return; }
      localStorage.setItem('poker_api_key', apiKey);

      isMonitoring = !isMonitoring;

      if (isMonitoring) {
        btnToggle.className = "action-btn btn-stop";
        btnToggle.innerText = "⏹ 停止即時監控";
        liveDot.className = "dot active";
        liveText.innerText = "自動監控中";
        statusText.innerText = "正在自動分析當前牌局...";
        runAutoLoop();
      } else {
        btnToggle.className = "action-btn btn-start";
        btnToggle.innerText = "▶ 啟動即時自動監控";
        liveDot.className = "dot";
        liveText.innerText = "已停止";
        statusText.innerText = "監控已暫停";
        if (timerId) clearTimeout(timerId);
      }
    }

    // 自動循環排程
    async function runAutoLoop() {
      if (!isMonitoring) return;

      if (!isProcessing) {
        isProcessing = true;
        await captureAndAnalyze();
        isProcessing = false;
      }

      // 完成一次辨識後，間隔 2.5 秒自動再拍下一幀
      if (isMonitoring) {
        timerId = setTimeout(runAutoLoop, 2500);
      }
    }

    async function captureAndAnalyze() {
      const apiKey = apiKeyInput.value.trim();
      
      try {
        canvas.width = 640;
        canvas.height = Math.floor(video.videoHeight * (640 / video.videoWidth)) || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const base64Img = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];

        const prompt = `你是專業德州撲克牌面識別專家。請分析這張圖片，提取以下 JSON 欄位：
1. my_cards: 玩家本人的2張手牌 (例如 ["9h", "4c"])
2. board: 公共牌 0~5張 (例如 ["10c", "5h", "As", "6s"])
3. pot: 當前底池總金額 (數字)
4. to_call: 當前需要跟注的金額 (無人下注或可過牌則為 0)
5. active_players: 目前在局人數 (數字)

嚴格僅輸出 JSON 物件，不要任何額外說明：
{"my_cards": ["9h", "4c"], "board": ["10c", "5h", "As", "6s"], "pot": 22.2, "to_call": 7.4, "active_players": 3}`;

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: "image/jpeg", data: base64Img } }
              ]
            }],
            generationConfig: { response_mime_type: "application/json", temperature: 0.1 }
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        const cleanJson = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
        const parsed = JSON.parse(cleanJson);
        
        displayResult(parsed);
        statusText.style.color = "#4ade80";
        statusText.innerText = "即時更新：" + new Date().toLocaleTimeString();
      } catch (err) {
        statusText.style.color = "#f87171";
        statusText.innerText = "偵測跳過 (" + err.message + ")";
      }
    }

    function displayResult(d) {
      document.getElementById('uiHand').innerText = (d.my_cards && d.my_cards.length > 0) ? d.my_cards.join(' ') : "無";
      document.getElementById('uiBoard').innerText = (d.board && d.board.length > 0) ? d.board.join(' ') : "無";

      const pot = parseFloat(d.pot) || 0;
      const call = parseFloat(d.to_call) || 0;
      
      let potOdds = 0;
      if (pot + call > 0 && call > 0) {
        potOdds = call / (pot + call);
      }

      let winRate = 0.08;
      if (d.my_cards && d.my_cards.length === 2) {
        if (d.my_cards[0][0] === d.my_cards[1][0]) winRate += 0.28;
        if (d.my_cards.some(c => c.toUpperCase().includes('A'))) winRate += 0.15;
      }

      document.getElementById('uiWin').innerText = (winRate * 100).toFixed(1) + "%";
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const actionBox = document.getElementById('uiAction');
      actionBox.style.display = 'block';

      if (call === 0) {
        actionBox.className = "recommend-box action-call";
        actionBox.innerText = "建議：過牌 (Check)";
      } else if (winRate < potOdds) {
        actionBox.className = "recommend-box action-fold";
        actionBox.innerText = `建議：棄牌 (FOLD)`;
      } else if (winRate > potOdds + 0.20) {
        actionBox.className = "recommend-box action-raise";
        actionBox.innerText = "建議：加注 (RAISE)";
      } else {
        actionBox.className = "recommend-box action-call";
        actionBox.innerText = "建議：跟注 (CALL)";
      }
    }
  </script>
</body>
</html>
