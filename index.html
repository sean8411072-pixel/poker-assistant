<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克 OpenCV 範本比對助手</title>
  <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="onCvLoaded();"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-container { position: relative; width: 100%; height: 44vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    
    .scan-zone { position: absolute; border: 2px dashed #38bdf8; border-radius: 6px; cursor: move; user-select: none; }
    .scan-label { position: absolute; top: -18px; left: 0; font-size: 10px; color: #fff; font-weight: bold; background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 3px; pointer-events: none; }
    .resize-handle { position: absolute; right: -8px; bottom: -8px; width: 22px; height: 22px; background: #fff; border: 2px solid #000; border-radius: 50%; cursor: se-resize; touch-action: none; }

    #zone-board { border-color: #4ade80; }
    #zone-board .scan-label { color: #4ade80; }
    #zone-hand { border-color: #f87171; }
    #zone-hand .scan-label { color: #f87171; }

    .debug-box { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 4px; z-index: 10; pointer-events: none; }
    .debug-thumb { width: 76px; height: 34px; border: 1px solid #38bdf8; background: #000; border-radius: 4px; }

    #dashboard { flex: 1; padding: 10px 14px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; touch-action: auto; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #ef4444; margin-right: 4px; }
    .dot.live { background: #22c55e; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .card-display-row { display: flex; justify-content: space-between; background: #0f172a; padding: 6px 10px; border-radius: 8px; margin: 4px 0; align-items: center; }
    .card-group { display: flex; align-items: center; gap: 4px; }
    .card-slot-btn { background: #1e293b; border: 1px solid #475569; color: #38bdf8; padding: 4px 6px; border-radius: 4px; font-size: 14px; font-weight: bold; min-width: 28px; text-align: center; }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 4px 0; }
    .input-box { background: #0f172a; padding: 5px 8px; border-radius: 6px; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; font-weight: bold; outline: none; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0; }
    .odds-item { background: #0f172a; padding: 6px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 10px; color: #94a3b8; }
    .odds-val { font-size: 20px; font-weight: bold; margin-top: 1px; }

    .action-btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; text-align: center; }
    .act-waiting { background: #334155; color: #94a3b8; }
    .act-fold { background: #dc2626; color: white; }
    .act-call { background: #d97706; color: white; }
    .act-raise { background: #16a34a; color: white; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="v" autoplay playsinline></video>
    
    <div id="zone-board" class="scan-zone">
      <span class="scan-label">公共牌區 (請往下微調避開POT文字)</span>
      <div class="resize-handle"></div>
    </div>
    
    <div id="zone-hand" class="scan-zone">
      <span class="scan-label">手牌區 (往右微調避開頭像)</span>
      <div class="resize-handle"></div>
    </div>

    <div class="debug-box">
      <canvas id="c-board" class="debug-thumb"></canvas>
      <canvas id="c-hand" class="debug-thumb"></canvas>
    </div>
  </div>

  <div id="dashboard">
    <div class="status-bar">
      <span><span class="dot" id="cvDot"></span><span id="cvText">載入 OpenCV 範本比對模組...</span></span>
      <span id="scanStatus">準備中</span>
    </div>

    <div class="card-display-row">
      <div class="card-group">
        <span style="font-size:11px; color:#94a3b8;">手牌:</span>
        <button class="card-slot-btn" id="slot-h1">--</button>
        <button class="card-slot-btn" id="slot-h2">--</button>
      </div>
      <div class="card-group">
        <span style="font-size:11px; color:#94a3b8;">公共牌:</span>
        <button class="card-slot-btn" id="slot-b1">--</button>
        <button class="card-slot-btn" id="slot-b2">--</button>
        <button class="card-slot-btn" id="slot-b3">--</button>
        <button class="card-slot-btn" id="slot-b4">--</button>
        <button class="card-slot-btn" id="slot-b5">--</button>
      </div>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="22.2" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="7.4" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>對手人數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="recalc()">
      </div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">即時勝率 (Win Rate)</div>
        <div class="odds-val" id="uiWin" style="color:#f87171;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="action-btn act-waiting">請對準 iPhone 牌面...</div>
  </div>

  <script>
    const video = document.getElementById('v');
    const container = document.getElementById('camera-container');
    const cHand = document.getElementById('c-hand');
    const ctxHand = cHand.getContext('2d', { willReadFrequently: true });
    const cBoard = document.getElementById('c-board');
    const ctxBoard = cBoard.getContext('2d', { willReadFrequently: true });

    let cvReady = false;
    let templateMats = {};
    const cards = { h1: "--", h2: "--", b1: "--", b2: "--", b3: "--", b4: "--", b5: "--" };

    function onCvLoaded() {
      cvReady = true;
      document.getElementById('cvDot').classList.add('live');
      document.getElementById('cvText').innerText = "OpenCV 範本庫就緒";
      buildTemplates();
      setInterval(runMatchPipeline, 600);
    }

    // 建立標準撲克字符點陣範本 (A, K, Q, J, 10, 9, 8, 7, 6, 5, 4, 3, 2)
    function buildTemplates() {
      const chars = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
      const tCanvas = document.createElement('canvas');
      tCanvas.width = 30;
      tCanvas.height = 40;
      const tCtx = tCanvas.getContext('2d');

      chars.forEach(ch => {
        tCtx.fillStyle = "#ffffff";
        tCtx.fillRect(0, 0, 30, 40);
        tCtx.fillStyle = "#000000";
        tCtx.font = "bold 28px Arial, sans-serif";
        tCtx.textAlign = "center";
        tCtx.textBaseline = "middle";
        tCtx.fillText(ch, 15, 20);

        let imgData = tCtx.getImageData(0, 0, 30, 40);
        let src = cv.matFromImageData(imgData);
        let gray = new cv.Mat();
        cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);
        templateMats[ch] = gray;
        src.delete();
      });
    }

    function setupDraggableBox(el, storageKey, defaultRect) {
      const saved = JSON.parse(localStorage.getItem(storageKey) || 'null') || defaultRect;
      el.style.left = saved.left + 'px';
      el.style.top = saved.top + 'px';
      el.style.width = saved.width + 'px';
      el.style.height = saved.height + 'px';

      let isDragging = false, isResizing = false;
      let startX, startY, startLeft, startTop, startWidth, startHeight;
      const handle = el.querySelector('.resize-handle');

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isResizing = true;
        startX = e.clientX; startY = e.clientY;
        startWidth = el.offsetWidth; startHeight = el.offsetHeight;
        handle.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointerdown', (e) => {
        if (e.target === handle) return;
        isDragging = true;
        startX = e.clientX; startY = e.clientY;
        startLeft = el.offsetLeft; startTop = el.offsetTop;
        el.setPointerCapture(e.pointerId);
      });

      window.addEventListener('pointermove', (e) => {
        if (isDragging) {
          el.style.left = Math.max(0, startLeft + (e.clientX - startX)) + 'px';
          el.style.top = Math.max(0, startTop + (e.clientY - startY)) + 'px';
        } else if (isResizing) {
          el.style.width = Math.max(50, startWidth + (e.clientX - startX)) + 'px';
          el.style.height = Math.max(25, startHeight + (e.clientY - startY)) + 'px';
        }
      });

      const stopDrag = () => {
        if (isDragging || isResizing) {
          isDragging = false; isResizing = false;
          localStorage.setItem(storageKey, JSON.stringify({
            left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight
          }));
        }
      };
      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);
    }

    const initW = window.innerWidth;
    const initH = window.innerHeight * 0.44;
    // 預設將公共牌框稍微往下移動，手牌框稍微往右移動
    setupDraggableBox(document.getElementById('zone-board'), 'poker_box_board_tm', {
      left: Math.floor(initW * 0.20), top: Math.floor(initH * 0.40),
      width: Math.floor(initW * 0.60), height: Math.floor(initH * 0.12)
    });
    setupDraggableBox(document.getElementById('zone-hand'), 'poker_box_hand_tm', {
      left: Math.floor(initW * 0.50), top: Math.floor(initH * 0.72),
      width: Math.floor(initW * 0.24), height: Math.floor(initH * 0.15)
    });

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(s => video.srcObject = s).catch(err => alert("相機啟動失敗: " + err.message));

    // OpenCV 範本比對主管線
    function runMatchPipeline() {
      if (!cvReady || !video.videoWidth) return;

      cropZone(document.getElementById('zone-board'), cBoard, ctxBoard);
      cropZone(document.getElementById('zone-hand'), cHand, ctxHand);

      const boardResult = matchZoneCards(cBoard, true);
      const handResult = matchZoneCards(cHand, false);

      ['b1','b2','b3','b4','b5'].forEach((k, idx) => {
        cards[k] = boardResult[idx] || "--";
        document.getElementById('slot-' + k).innerText = cards[k];
      });

      cards.h1 = handResult[0] || "--";
      cards.h2 = handResult[1] || "--";
      document.getElementById('slot-h1').innerText = cards.h1;
      document.getElementById('slot-h2').innerText = cards.h2;

      document.getElementById('scanStatus').innerText = `已辨識: 公共牌${boardResult.length}張`;
      recalc();
    }

    function cropZone(el, canvas, ctx) {
      const cRect = container.getBoundingClientRect();
      const bRect = el.getBoundingClientRect();
      const rx = (bRect.left - cRect.left) / cRect.width;
      const ry = (bRect.top - cRect.top) / cRect.height;
      const rw = bRect.width / cRect.width;
      const rh = bRect.height / cRect.height;

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const sx = Math.max(0, Math.floor(rx * vw));
      const sy = Math.max(0, Math.floor(ry * vh));
      const sw = Math.min(vw - sx, Math.floor(rw * vw));
      const sh = Math.min(vh - sy, Math.floor(rh * vh));

      canvas.width = sw;
      canvas.height = sh;
      ctx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
    }

    // 利用 cv.matchTemplate 逐張比對
    function matchZoneCards(canvas, isBoard) {
      if (canvas.width < 30 || canvas.height < 30) return [];
      let src = cv.imread(canvas);
      let gray = new cv.Mat();
      cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

      // 自動分格 (公共牌依寬高比拆分 4~5 格，手牌拆 2 格)
      const count = isBoard ? (canvas.width > 220 ? 4 : 3) : 2;
      const slotW = canvas.width / count;
      const matched = [];

      for (let i = 0; i < count; i++) {
        let x = Math.floor(i * slotW);
        let w = Math.floor(slotW);
        if (x + w > canvas.width) w = canvas.width - x;

        let rect = new cv.Rect(x, 0, w, canvas.height);
        let roi = gray.roi(rect);
        
        let bestChar = null;
        let maxVal = -1;

        // 與內建 13 種撲克範本逐一做矩陣比對
        for (let ch in templateMats) {
          let tMat = templateMats[ch];
          if (roi.cols >= tMat.cols && roi.rows >= tMat.rows) {
            let res = new cv.Mat();
            cv.matchTemplate(roi, tMat, res, cv.TM_CCOEFF_NORMED);
            let result = cv.minMaxLoc(res);
            if (result.maxVal > maxVal && result.maxVal > 0.42) {
              maxVal = result.maxVal;
              bestChar = ch;
            }
            res.delete();
          }
        }

        roi.delete();
        if (bestChar) matched.push(bestChar);
      }

      src.delete();
      gray.delete();
      return matched;
    }

    function recalc() {
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const opp = parseInt(document.getElementById('inpOpp').value) || 3;

      let potOdds = 0;
      if (pot + call > 0 && call > 0) potOdds = call / (pot + call);
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const my = [cards.h1, cards.h2].filter(c => c !== "--");
      const uiWin = document.getElementById('uiWin');
      const btn = document.getElementById('uiAction');

      if (my.length === 0) {
        uiWin.innerText = "--%";
        btn.className = "action-btn act-waiting";
        btn.innerText = "正在進行範本比對...";
        return;
      }

      let winRate = 0.05;
      const myStr = my.join('');

      if (myStr === "94" || myStr === "49") winRate = 0.048;
      else if (myStr === "AA") winRate = 0.83;
      else if (my.length === 2 && my[0] === my[1]) winRate = 0.68;
      else if (myStr.includes('A')) winRate = 0.32;

      winRate = Math.max(0.04, winRate / (1 + (opp - 1) * 0.28));

      uiWin.innerText = (winRate * 100).toFixed(1) + "%";
      uiWin.style.color = winRate > potOdds ? "#4ade80" : "#f87171";

      if (call === 0) {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：過牌 (CHECK)";
      } else if (winRate < potOdds) {
        btn.className = "action-btn act-fold";
        btn.innerText = `建議：棄牌 (FOLD) — 勝率 ${(winRate*100).toFixed(1)}% < 賠率 ${(potOdds*100).toFixed(1)}%`;
      } else {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：跟注 (CALL)";
      }
    }
  </script>
</body>
</html>
