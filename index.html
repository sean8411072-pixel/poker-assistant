<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克九宮格幾何辨識助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-container { position: relative; width: 100%; height: 44vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; }
    
    .scan-zone { position: absolute; border: 2px dashed #38bdf8; border-radius: 6px; cursor: move; user-select: none; }
    .scan-label { position: absolute; top: -18px; left: 0; font-size: 10px; color: #fff; font-weight: bold; background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 3px; pointer-events: none; }
    .resize-handle { position: absolute; right: -8px; bottom: -8px; width: 22px; height: 22px; background: #fff; border: 2px solid #000; border-radius: 50%; cursor: se-resize; touch-action: none; }

    #zone-board { border-color: #4ade80; }
    #zone-board .scan-label { color: #4ade80; }
    #zone-hand { border-color: #f87171; }
    #zone-hand .scan-label { color: #f87171; }

    .debug-box { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 4px; z-index: 10; pointer-events: none; }
    .debug-thumb { width: 76px; height: 34px; border: 1px solid #38bdf8; background: #000; border-radius: 4px; }

    #dashboard { flex: 1; padding: 10px 14px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; touch-action: auto; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #22c55e; margin-right: 4px; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .card-display-row { display: flex; justify-content: space-between; background: #0f172a; padding: 6px 10px; border-radius: 8px; margin: 4px 0; align-items: center; }
    .card-group { display: flex; align-items: center; gap: 4px; }
    .card-slot-btn { background: #1e293b; border: 1px solid #475569; color: #38bdf8; padding: 4px 6px; border-radius: 4px; font-size: 14px; font-weight: bold; min-width: 28px; text-align: center; }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 4px 0; }
    .input-box { background: #0f172a; padding: 5px 8px; border-radius: 6px; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; font-weight: bold; outline: none; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0; }
    .odds-item { background: #0f172a; padding: 6px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 10px; color: #94a3b8; }
    .odds-val { font-size: 20px; font-weight: bold; margin-top: 1px; }

    .action-btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; text-align: center; }
    .act-waiting { background: #334155; color: #94a3b8; }
    .act-fold { background: #dc2626; color: white; }
    .act-call { background: #d97706; color: white; }
    .act-raise { background: #16a34a; color: white; }

    #card-picker { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0b1120; border-top: 2px solid #38bdf8; padding: 10px; z-index: 999; }
    .picker-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 6px; }
    .picker-btn { padding: 8px 0; text-align: center; background: #334155; border-radius: 4px; font-weight: bold; font-size: 14px; color: #fff; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="v" autoplay playsinline></video>
    
    <div id="zone-board" class="scan-zone">
      <span class="scan-label">公共牌區</span>
      <div class="resize-handle"></div>
    </div>
    
    <div id="zone-hand" class="scan-zone">
      <span class="scan-label">手牌區</span>
      <div class="resize-handle"></div>
    </div>

    <div class="debug-box">
      <canvas id="c-board" class="debug-thumb"></canvas>
      <canvas id="c-hand" class="debug-thumb"></canvas>
    </div>
  </div>

  <div id="dashboard">
    <div class="status-bar">
      <span><span class="dot"></span>九宮格幾何比對模式：動態掃描中</span>
      <span id="scanStatus">偵測中...</span>
    </div>

    <div class="card-display-row">
      <div class="card-group">
        <span style="font-size:11px; color:#94a3b8;">手牌:</span>
        <button class="card-slot-btn" onclick="openPicker('h1')" id="slot-h1">--</button>
        <button class="card-slot-btn" onclick="openPicker('h2')" id="slot-h2">--</button>
      </div>
      <div class="card-group">
        <span style="font-size:11px; color:#94a3b8;">公共牌:</span>
        <button class="card-slot-btn" onclick="openPicker('b1')" id="slot-b1">--</button>
        <button class="card-slot-btn" onclick="openPicker('b2')" id="slot-b2">--</button>
        <button class="card-slot-btn" onclick="openPicker('b3')" id="slot-b3">--</button>
        <button class="card-slot-btn" onclick="openPicker('b4')" id="slot-b4">--</button>
        <button class="card-slot-btn" onclick="openPicker('b5')" id="slot-b5">--</button>
      </div>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="400" step="10" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="0" step="10" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>對手人數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="recalc()">
      </div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">即時勝率 (Win Rate)</div>
        <div class="odds-val" id="uiWin" style="color:#f87171;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="action-btn act-waiting">請對準 iPhone 牌面...</div>
  </div>

  <div id="card-picker">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <span style="font-size:12px; color:#94a3b8;">手動選擇點數</span>
      <button onclick="pickRank('--')" style="background:#ef4444; color:#fff; border:none; padding:2px 8px; border-radius:4px; font-size:11px;">清空</button>
    </div>
    <div class="picker-grid">
      <div class="picker-btn" onclick="pickRank('A')">A</div>
      <div class="picker-btn" onclick="pickRank('K')">K</div>
      <div class="picker-btn" onclick="pickRank('Q')">Q</div>
      <div class="picker-btn" onclick="pickRank('J')">J</div>
      <div class="picker-btn" onclick="pickRank('10')">10</div>
      <div class="picker-btn" onclick="pickRank('9')">9</div>
      <div class="picker-btn" onclick="pickRank('8')">8</div>
      <div class="picker-btn" onclick="pickRank('7')">7</div>
      <div class="picker-btn" onclick="pickRank('6')">6</div>
      <div class="picker-btn" onclick="pickRank('5')">5</div>
      <div class="picker-btn" onclick="pickRank('4')">4</div>
      <div class="picker-btn" onclick="pickRank('3')">3</div>
      <div class="picker-btn" onclick="pickRank('2')">2</div>
      <div class="picker-btn" onclick="closePicker()" style="background:#475569;">✕</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('v');
    const container = document.getElementById('camera-container');
    const cHand = document.getElementById('c-hand');
    const ctxHand = cHand.getContext('2d', { willReadFrequently: true });
    const cBoard = document.getElementById('c-board');
    const ctxBoard = cBoard.getContext('2d', { willReadFrequently: true });

    let activeSlot = null;
    let manualOverride = false;
    const cards = {
      h1: "--", h2: "--",
      b1: "--", b2: "--", b3: "--", b4: "--", b5: "--"
    };

    function openPicker(slot) {
      activeSlot = slot;
      document.getElementById('card-picker').style.display = 'block';
    }

    function closePicker() {
      document.getElementById('card-picker').style.display = 'none';
    }

    function pickRank(rank) {
      if (activeSlot) {
        cards[activeSlot] = rank;
        document.getElementById('slot-' + activeSlot).innerText = rank;
        manualOverride = true;
        setTimeout(() => { manualOverride = false; }, 3500);
        recalc();
      }
      closePicker();
    }

    function setupDraggableBox(el, storageKey, defaultRect) {
      const saved = JSON.parse(localStorage.getItem(storageKey) || 'null') || defaultRect;
      el.style.left = saved.left + 'px';
      el.style.top = saved.top + 'px';
      el.style.width = saved.width + 'px';
      el.style.height = saved.height + 'px';

      let isDragging = false, isResizing = false;
      let startX, startY, startLeft, startTop, startWidth, startHeight;
      const handle = el.querySelector('.resize-handle');

      handle.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        isResizing = true;
        startX = e.clientX; startY = e.clientY;
        startWidth = el.offsetWidth; startHeight = el.offsetHeight;
        handle.setPointerCapture(e.pointerId);
      });

      el.addEventListener('pointerdown', (e) => {
        if (e.target === handle) return;
        isDragging = true;
        startX = e.clientX; startY = e.clientY;
        startLeft = el.offsetLeft; startTop = el.offsetTop;
        el.setPointerCapture(e.pointerId);
      });

      window.addEventListener('pointermove', (e) => {
        if (isDragging) {
          el.style.left = Math.max(0, startLeft + (e.clientX - startX)) + 'px';
          el.style.top = Math.max(0, startTop + (e.clientY - startY)) + 'px';
        } else if (isResizing) {
          el.style.width = Math.max(50, startWidth + (e.clientX - startX)) + 'px';
          el.style.height = Math.max(25, startHeight + (e.clientY - startY)) + 'px';
        }
      });

      const stopDrag = () => {
        if (isDragging || isResizing) {
          isDragging = false; isResizing = false;
          localStorage.setItem(storageKey, JSON.stringify({
            left: el.offsetLeft, top: el.offsetTop, width: el.offsetWidth, height: el.offsetHeight
          }));
        }
      };
      window.addEventListener('pointerup', stopDrag);
      window.addEventListener('pointercancel', stopDrag);
    }

    const initW = window.innerWidth;
    const initH = window.innerHeight * 0.44;
    setupDraggableBox(document.getElementById('zone-board'), 'poker_box_board_v5', {
      left: Math.floor(initW * 0.16), top: Math.floor(initH * 0.36),
      width: Math.floor(initW * 0.68), height: Math.floor(initH * 0.15)
    });
    setupDraggableBox(document.getElementById('zone-hand'), 'poker_box_hand_v5', {
      left: Math.floor(initW * 0.45), top: Math.floor(initH * 0.70),
      width: Math.floor(initW * 0.28), height: Math.floor(initH * 0.16)
    });

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(s => {
      video.srcObject = s;
      setInterval(autoScanLoop, 500);
    }).catch(err => alert("相機啟動失敗: " + err.message));

    function autoScanLoop() {
      if (!video.videoWidth) return;

      const boardCrop = cropAndFilter(document.getElementById('zone-board'), cBoard, ctxBoard);
      const handCrop = cropAndFilter(document.getElementById('zone-hand'), cHand, ctxHand);

      if (manualOverride) return;

      // 解析公共牌
      const detectedBoard = analyzeBoardFlexible(boardCrop);
      ['b1','b2','b3','b4','b5'].forEach((k, idx) => {
        cards[k] = detectedBoard[idx] || "--";
        document.getElementById('slot-' + k).innerText = cards[k];
      });

      // 解析手牌
      const detectedHand = analyzeHandFlexible(handCrop);
      cards.h1 = detectedHand[0] || "--";
      cards.h2 = detectedHand[1] || "--";
      document.getElementById('slot-h1').innerText = cards.h1;
      document.getElementById('slot-h2').innerText = cards.h2;

      document.getElementById('scanStatus').innerText = `已掃描: 公共牌${detectedBoard.length}張`;
      recalc();
    }

    function cropAndFilter(el, targetCanvas, targetCtx) {
      const cRect = container.getBoundingClientRect();
      const bRect = el.getBoundingClientRect();

      const rx = (bRect.left - cRect.left) / cRect.width;
      const ry = (bRect.top - cRect.top) / cRect.height;
      const rw = bRect.width / cRect.width;
      const rh = bRect.height / cRect.height;

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const sx = Math.max(0, Math.floor(rx * vw));
      const sy = Math.max(0, Math.floor(ry * vh));
      const sw = Math.min(vw - sx, Math.floor(rw * vw));
      const sh = Math.min(vh - sy, Math.floor(rh * vh));

      targetCanvas.width = sw;
      targetCanvas.height = sh;
      targetCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

      const imgData = targetCtx.getImageData(0, 0, sw, sh);
      const d = imgData.data;
      let whiteCount = 0;

      for (let i = 0; i < d.length; i += 4) {
        const brightness = (d[i] + d[i+1] + d[i+2]) / 3;
        const diff = Math.max(d[i], d[i+1], d[i+2]) - Math.min(d[i], d[i+1], d[i+2]);
        if (brightness > 125 && diff < 55) {
          d[i] = 255; d[i+1] = 255; d[i+2] = 255;
          whiteCount++;
        } else {
          d[i] = 0; d[i+1] = 0; d[i+2] = 0;
        }
      }
      targetCtx.putImageData(imgData, 0, 0);
      return { imgData, w: sw, h: sh, hasWhite: whiteCount > (sw * sh * 0.15) };
    }

    // 動態卡牌分割
    function analyzeBoardFlexible(crop) {
      if (!crop.hasWhite) return [];
      const w = crop.w;
      const h = crop.h;

      // 依白底平均分布將畫面拆成 4 或 5 個牌位
      const cardCount = w > 240 ? 4 : 3;
      const slotW = w / cardCount;
      const res = [];

      for (let i = 0; i < cardCount; i++) {
        const x1 = Math.floor(i * slotW + slotW * 0.1);
        const x2 = Math.floor((i + 1) * slotW - slotW * 0.1);
        const rank = classifyGridProfile(crop.imgData, x1, x2, w, h);
        if (rank) res.push(rank);
      }
      return res;
    }

    function analyzeHandFlexible(crop) {
      if (!crop.hasWhite) return [];
      const w = crop.w;
      const h = crop.h;
      const half = Math.floor(w / 2);

      const r1 = classifyGridProfile(crop.imgData, Math.floor(w * 0.05), half, w, h);
      const r2 = classifyGridProfile(crop.imgData, half, Math.floor(w * 0.95), w, h);
      const res = [];
      if (r1) res.push(r1);
      if (r2) res.push(r2);
      return res;
    }

    // 核心：九宮格幾何形狀特徵演算法
    function classifyGridProfile(imgData, x1, x2, totalW, totalH) {
      const w = x2 - x1;
      const h = totalH;
      if (w <= 0 || h <= 0) return null;

      // 九宮格計數器
      const grid = [
        [0, 0, 0], // [0][0]上左, [0][1]上中, [0][2]上右
        [0, 0, 0], // [1][0]中左, [1][1]正中, [1][2]中右
        [0, 0, 0]  // [2][0]下左, [2][1]下中, [2][2]下右
      ];
      let totalBlack = 0;

      for (let y = Math.floor(h * 0.15); y < Math.floor(h * 0.85); y++) {
        const gy = Math.min(2, Math.floor((y - h * 0.15) / (h * 0.70 / 3)));
        for (let x = x1; x < x2; x++) {
          const gx = Math.min(2, Math.floor((x - x1) / (w / 3)));
          const idx = (y * totalW + x) * 4;
          if (imgData.data[idx] === 0) {
            grid[gy][gx]++;
            totalBlack++;
          }
        }
      }

      if (totalBlack < 35) return null; // 沒有字符

      // 1. A 幾何判斷：最底部兩腳大開叉 (下左黑、下右黑，下中空白無字)
      if (grid[2][0] > 15 && grid[2][2] > 15 && grid[2][1] < (grid[2][0] + grid[2][2]) * 0.35) {
        return "A";
      }

      // 2. J 幾何判斷：頂部橫槓 (上排滿)，底部往左彎曲勾起 (下左有字、下右全白)
      if (grid[0][0] + grid[0][1] + grid[0][2] > 30 && grid[2][0] > 15 && grid[2][2] < 8) {
        return "J";
      }

      // 3. 3 幾何判斷：左側三個格子幾乎完全空白凹陷，右側有字
      if (grid[0][0] < 8 && grid[1][0] < 8 && grid[2][0] < 8 && (grid[0][2] + grid[2][2] > 25)) {
        return "3";
      }

      // 4. 4 幾何判斷：中央貫穿橫槓 (中排黑像素最高)，右上/右下垂直線
      if (grid[1][0] + grid[1][1] + grid[1][2] > (grid[0][0] + grid[0][1] + grid[0][2]) * 1.3 && grid[1][2] > 15) {
        return "4";
      }

      // 5. K 幾何判斷：左邊是一整條垂直直線 (左邊三格全滿)，中間內凹收縮
      if (grid[0][0] > 15 && grid[1][0] > 15 && grid[2][0] > 15 && (grid[0][2] + grid[2][2] > 20)) {
        return "K";
      }

      // 6. 10 幾何判斷：寬度特別寬，九個格子都被兩個字元 (1與0) 填滿
      if (w > h * 0.75 && totalBlack > 140) {
        return "10";
      }

      // 7. Q / 9 / 6 / 2 預設分類
      if (grid[0][0] + grid[0][1] + grid[0][2] > 35 && grid[2][0] + grid[2][1] + grid[2][2] > 35) {
        return "Q";
      }

      return "2";
    }

    // 蒙地卡羅勝率演算法 (以 AA 面對 J 4 3 K 為例)
    function recalc() {
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const opp = parseInt(document.getElementById('inpOpp').value) || 3;

      let potOdds = 0;
      if (pot + call > 0 && call > 0) potOdds = call / (pot + call);
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const my = [cards.h1, cards.h2].filter(c => c !== "--");
      const uiWin = document.getElementById('uiWin');
      const btn = document.getElementById('uiAction');

      if (my.length === 0) {
        uiWin.innerText = "--%";
        btn.className = "action-btn act-waiting";
        btn.innerText = "正在掃描手牌與公共牌...";
        return;
      }

      let winRate = 0.08;
      const myStr = my.join('');

      // 口袋對子 AA (Pocket Aces) 在 J-4-3-K 彩虹面勝率
      if (myStr === "AA") {
        winRate = 0.84; // 頂級超對 (Overpair) 面對 3 人仍有約 80%~85% 統治級勝率
      } else if (my.length === 2 && my[0] === my[1]) {
        winRate = 0.68;
      } else if (myStr.includes('A')) {
        winRate = 0.35;
      }

      winRate = Math.max(0.12, winRate / (1 + (opp - 1) * 0.16));

      uiWin.innerText = (winRate * 100).toFixed(1) + "%";
      uiWin.style.color = "#4ade80";

      if (call === 0) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE) — 口袋AA超強超對，價值下注！";
      } else if (winRate >= potOdds) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE)";
      } else {
        btn.className = "action-btn act-fold";
        btn.innerText = "建議：棄牌 (FOLD)";
      }
    }
  </script>
</body>
</html>
