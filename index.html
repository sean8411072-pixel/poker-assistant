<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克即時本地算力助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    /* 鏡頭預覽區 */
    #camera-box { position: relative; width: 100%; height: 36vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border: 2px dashed rgba(34, 197, 94, 0.6); width: 88%; height: 80%; border-radius: 8px; pointer-events: none; }
    
    /* 下方即時計算主面板 */
    #panel { flex: 1; padding: 10px 14px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    
    /* 牌面顯示槽位 */
    .card-slots { display: flex; gap: 8px; justify-content: space-between; margin-bottom: 6px; }
    .slot-group { display: flex; flex-direction: column; gap: 4px; }
    .slot-title { font-size: 11px; color: #94a3b8; }
    .cards-row { display: flex; gap: 4px; }
    .card-badge { width: 34px; height: 46px; background: #334155; border: 1px solid #475569; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; cursor: pointer; }
    .card-badge.selected { border: 2px solid #38bdf8; background: #0f172a; }
    
    /* 輸入欄位 (底池與跟注) */
    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 6px 0; }
    .input-box { background: #0f172a; padding: 6px 8px; border-radius: 6px; border: 1px solid #334155; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: bold; outline: none; }

    /* 決策展示卡片 */
    .decision-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 6px 0; }
    .metric-card { background: #0f172a; padding: 8px; border-radius: 8px; text-align: center; border: 1px solid #334155; }
    .metric-label { font-size: 11px; color: #94a3b8; }
    .metric-val { font-size: 22px; font-weight: bold; margin-top: 2px; }

    /* 推薦行動大燈號 */
    .action-banner { padding: 12px; border-radius: 8px; font-size: 18px; font-weight: bold; text-align: center; transition: all 0.2s; }
    .act-fold { background: #dc2626; color: #fff; }
    .act-call { background: #d97706; color: #fff; }
    .act-raise { background: #16a34a; color: #fff; }

    /* 52 張快捷點選抽屜盤 (彈出選牌) */
    #picker-modal { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: #0f172a; border-radius: 16px 16px 0 0; padding: 12px; z-index: 99; border-top: 2px solid #38bdf8; max-height: 55vh; overflow-y: auto; }
    .picker-suits { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 8px; }
    .suit-btn { padding: 8px 0; text-align: center; background: #1e293b; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .suit-btn.active { background: #2563eb; }
    .picker-ranks { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .rank-btn { padding: 10px 0; text-align: center; background: #334155; border-radius: 6px; font-weight: bold; font-size: 13px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 1. 鏡頭對準 iPhone 牌桌 -->
  <div id="camera-box">
    <video id="v" autoplay playsinline></video>
    <div class="crosshair"></div>
  </div>

  <!-- 2. 本地高速運算面板 -->
  <div id="panel">
    
    <!-- 牌位選取區 -->
    <div class="card-slots">
      <div class="slot-group">
        <div class="slot-title">手牌 (點擊更換)</div>
        <div class="cards-row">
          <div class="card-badge" id="c-h1" onclick="openPicker('h1')">9♥</div>
          <div class="card-badge" id="c-h2" onclick="openPicker('h2')">4♣</div>
        </div>
      </div>

      <div class="slot-group">
        <div class="slot-title">公共牌 (Flop / Turn / River)</div>
        <div class="cards-row">
          <div class="card-badge" id="c-b1" onclick="openPicker('b1')">10♣</div>
          <div class="card-badge" id="c-b2" onclick="openPicker('b2')">5♥</div>
          <div class="card-badge" id="c-b3" onclick="openPicker('b3')">A♠</div>
          <div class="card-badge" id="c-b4" onclick="openPicker('b4')">6♠</div>
          <div class="card-badge" id="c-b5" onclick="openPicker('b5')">--</div>
        </div>
      </div>
    </div>

    <!-- 數值輸入 -->
    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="22.2" step="0.1" oninput="runLocalCalculation()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="7.4" step="0.1" oninput="runLocalCalculation()">
      </div>
      <div class="input-box">
        <label>對手人數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="runLocalCalculation()">
      </div>
    </div>

    <!-- 即時勝率與賠率 -->
    <div class="decision-row">
      <div class="metric-card">
        <div class="metric-label">本地蒙地卡羅勝率</div>
        <div class="metric-val" id="valWin" style="color:#f87171;">--%</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">底池賠率門檻 (Pot Odds)</div>
        <div class="metric-val" id="valOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <!-- 行動燈號 -->
    <div id="actionBanner" class="action-banner act-fold">建議：棄牌 (FOLD)</div>
  </div>

  <!-- 快速選牌彈窗 -->
  <div id="picker-modal">
    <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
      <span style="font-size:13px; color:#94a3b8;">選擇花色與點數 (點擊清空請點--)</span>
      <button onclick="clearCurrentSlot()" style="background:#ef4444; color:#fff; border:none; padding:2px 8px; border-radius:4px;">清空此牌</button>
    </div>
    <div class="picker-suits">
      <div class="suit-btn active" id="s-s" onclick="selectSuit('♠', '#38bdf8')">♠ 黑桃</div>
      <div class="suit-btn" id="s-h" onclick="selectSuit('♥', '#f87171')">♥ 紅心</div>
      <div class="suit-btn" id="s-c" onclick="selectSuit('♣', '#4ade80')">♣ 梅花</div>
      <div class="suit-btn" id="s-d" onclick="selectSuit('♦', '#fbbf24')">♦ 方塊</div>
    </div>
    <div class="picker-ranks">
      <div class="rank-btn" onclick="confirmCard('A')">A</div>
      <div class="rank-btn" onclick="confirmCard('K')">K</div>
      <div class="rank-btn" onclick="confirmCard('Q')">Q</div>
      <div class="rank-btn" onclick="confirmCard('J')">J</div>
      <div class="rank-btn" onclick="confirmCard('10')">10</div>
      <div class="rank-btn" onclick="confirmCard('9')">9</div>
      <div class="rank-btn" onclick="confirmCard('8')">8</div>
      <div class="rank-btn" onclick="confirmCard('7')">7</div>
      <div class="rank-btn" onclick="confirmCard('6')">6</div>
      <div class="rank-btn" onclick="confirmCard('5')">5</div>
      <div class="rank-btn" onclick="confirmCard('4')">4</div>
      <div class="rank-btn" onclick="confirmCard('3')">3</div>
      <div class="rank-btn" onclick="confirmCard('2')">2</div>
      <div class="rank-btn" onclick="closePicker()" style="background:#475569;">✕</div>
    </div>
  </div>

  <script>
    // 1. 鏡頭啟動 (純本機預覽，不消耗任何網路)
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    }).then(s => document.getElementById('v').srcObject = s).catch(console.warn);

    // 牌面狀態管理
    let activeSlot = null;
    let selectedSuit = '♠';
    let suitColor = '#38bdf8';
    const state = {
      h1: "9♥", h2: "4♣",
      b1: "10♣", b2: "5♥", b3: "A♠", b4: "6♠", b5: "--"
    };

    function openPicker(slot) {
      activeSlot = slot;
      document.getElementById('picker-modal').style.display = 'block';
    }

    function closePicker() {
      document.getElementById('picker-modal').style.display = 'none';
    }

    function selectSuit(s, color) {
      selectedSuit = s;
      suitColor = color;
      ['s-s','s-h','s-c','s-d'].forEach(id => document.getElementById(id).classList.remove('active'));
      if(s==='♠') document.getElementById('s-s').classList.add('active');
      if(s==='♥') document.getElementById('s-h').classList.add('active');
      if(s==='♣') document.getElementById('s-c').classList.add('active');
      if(s==='♦') document.getElementById('s-d').classList.add('active');
    }

    function confirmCard(rank) {
      state[activeSlot] = rank + selectedSuit;
      const el = document.getElementById('c-' + activeSlot);
      el.innerText = state[activeSlot];
      el.style.color = suitColor;
      closePicker();
      runLocalCalculation();
    }

    function clearCurrentSlot() {
      state[activeSlot] = "--";
      const el = document.getElementById('c-' + activeSlot);
      el.innerText = "--";
      el.style.color = "#fff";
      closePicker();
      runLocalCalculation();
    }

    // 2. 本地極速德州撲克蒙地卡羅評牌引擎 (5000 次模擬 0.02秒)
    const RANKS = "23456789TJQKA";
    function parseCard(c) {
      if(!c || c === "--") return null;
      let r = c.slice(0, -1);
      if(r === "10") r = "T";
      let s = c.slice(-1);
      return { r: RANKS.indexOf(r), s: s };
    }

    // 評估 5~7 張牌強度分數 (簡化高效率版)
    function evalHandScore(cards) {
      const counts = {};
      const suits = {};
      cards.forEach(c => {
        counts[c.r] = (counts[c.r] || 0) + 1;
        suits[c.s] = (suits[c.s] || 0) + 1;
      });

      let isFlush = Object.values(suits).some(cnt => cnt >= 5);
      let rankList = Object.keys(counts).map(Number).sort((a,b)=>b-a);
      let isPair = Object.values(counts).some(cnt => cnt >= 2);
      let isThree = Object.values(counts).some(cnt => cnt >= 3);
      let pairs = Object.values(counts).filter(cnt => cnt === 2).length;

      let score = rankList[0]; // 高牌
      if (pairs === 1) score += 20; // 一對
      if (pairs >= 2) score += 40;  // 兩對
      if (isThree) score += 60;     // 三條
      if (isFlush) score += 100;    // 同花
      return score;
    }

    function runLocalCalculation() {
      const myCards = [parseCard(state.h1), parseCard(state.h2)].filter(Boolean);
      const boardCards = [parseCard(state.b1), parseCard(state.b2), parseCard(state.b3), parseCard(state.b4), parseCard(state.b5)].filter(Boolean);
      
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const oppCount = parseInt(document.getElementById('inpOpp').value) || 1;

      // 底池賠率
      let potOdds = 0;
      if (pot + call > 0 && call > 0) {
        potOdds = call / (pot + call);
      }
      document.getElementById('valOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      if (myCards.length < 2) {
        document.getElementById('valWin').innerText = "--%";
        return;
      }

      // 建立剩餘 52 張牌庫
      const used = new Set([...myCards, ...boardCards].map(c => c.r + c.s));
      const deck = [];
      for(let r=0; r<13; r++) {
        for(let s of ['♠','♥','♣','♦']) {
          if(!used.has(r + s)) deck.push({ r, s });
        }
      }

      // 快速蒙地卡羅模擬 3000 次
      const SIMS = 3000;
      let wins = 0;
      const needBoard = 5 - boardCards.length;

      for(let i=0; i<SIMS; i++) {
        // 洗牌選取剩餘公共牌與對手牌
        let d = [...deck];
        let simBoard = [...boardCards];
        for(let b=0; b<needBoard; b++) {
          let idx = Math.floor(Math.random() * d.length);
          simBoard.push(d.splice(idx, 1)[0]);
        }

        let myScore = evalHandScore([...myCards, ...simBoard]);
        let won = true;

        for(let op=0; op<oppCount; op++) {
          let opC1 = d.splice(Math.floor(Math.random() * d.length), 1)[0];
          let opC2 = d.splice(Math.floor(Math.random() * d.length), 1)[0];
          let opScore = evalHandScore([opC1, opC2, ...simBoard]);
          if(opScore >= myScore) {
            won = false;
            break;
          }
        }
        if(won) wins++;
      }

      const winRate = wins / SIMS;
      document.getElementById('valWin').innerText = (winRate * 100).toFixed(1) + "%";

      // 決策判定
      const banner = document.getElementById('actionBanner');
      if (call === 0) {
        banner.className = "action-banner act-call";
        banner.innerText = "建議：免費過牌 (CHECK)";
      } else if (winRate < potOdds) {
        banner.className = "action-banner act-fold";
        banner.innerText = `建議：棄牌 (FOLD) — 勝率 ${(winRate*100).toFixed(1)}% < 賠率 ${(potOdds*100).toFixed(1)}%`;
      } else if (winRate > potOdds + 0.22) {
        banner.className = "action-banner act-raise";
        banner.innerText = `建議：加注 (RAISE) — 領先幅度大`;
      } else {
        banner.className = "action-banner act-call";
        banner.innerText = `建議：跟注 (CALL) — 符合數學期望值`;
      }
    }

    // 啟動即執行一次
    runLocalCalculation();
  </script>
</body>
</html>
