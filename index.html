<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克精準校正辨識</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-container { position: relative; width: 100%; height: 48vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: contain; } /* 改用 contain 確保畫面不被裁切拉伸 */
    
    /* 精準位置瞄準框 */
    .scan-zone { position: absolute; border: 2px dashed #38bdf8; border-radius: 6px; pointer-events: none; transition: border-color 0.2s; }
    .scan-label { position: absolute; top: -18px; left: 0; font-size: 10px; color: #fff; font-weight: bold; background: rgba(0,0,0,0.7); padding: 1px 5px; border-radius: 3px; }
    
    /* 1. 公共牌區：下修高度，緊密貼合 5 張公共牌，避開上方籌碼數字 */
    #zone-board { top: 37%; left: 24%; width: 52%; height: 12%; border-color: #4ade80; }
    #zone-board .scan-label { color: #4ade80; }
    
    /* 2. 手牌區：往右側移動，精準框住頭像右邊的 2 張手牌 */
    #zone-hand { bottom: 12%; left: 45%; width: 28%; height: 14%; border-color: #f87171; }
    #zone-hand .scan-label { color: #f87171; }

    /* 即時辨識除錯畫布 (確認相機到底切到了什麼) */
    .debug-box { position: absolute; bottom: 6px; left: 6px; display: flex; gap: 4px; z-index: 10; }
    .debug-thumb { width: 64px; height: 32px; border: 1px solid #38bdf8; background: #000; border-radius: 4px; }

    #dashboard { flex: 1; padding: 10px 14px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #ef4444; margin-right: 4px; }
    .dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .detected-row { display: flex; justify-content: space-between; background: #0f172a; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin: 4px 0; }
    .detected-row b { color: #38bdf8; font-size: 17px; }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin: 4px 0; }
    .input-box { background: #0f172a; padding: 5px 8px; border-radius: 6px; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 14px; font-weight: bold; outline: none; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 4px 0; }
    .odds-item { background: #0f172a; padding: 6px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 10px; color: #94a3b8; }
    .odds-val { font-size: 20px; font-weight: bold; margin-top: 1px; }

    .action-btn { width: 100%; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 8px; border: none; text-align: center; }
    .act-waiting { background: #334155; color: #94a3b8; }
    .act-fold { background: #dc2626; color: white; }
    .act-call { background: #d97706; color: white; }
    .act-raise { background: #16a34a; color: white; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="v" autoplay playsinline></video>
    
    <div id="zone-board" class="scan-zone"><span class="scan-label">公共牌區</span></div>
    <div id="zone-hand" class="scan-zone"><span class="scan-label">玩家手牌區</span></div>

    <!-- 左下角除錯小窗：即時顯示程式切到的公共牌與手牌黑白圖 -->
    <div class="debug-box">
      <canvas id="c-board" class="debug-thumb" title="公共牌切圖"></canvas>
      <canvas id="c-hand" class="debug-thumb" title="手牌切圖"></canvas>
    </div>
  </div>

  <div id="dashboard">
    <div class="status-bar">
      <span><span class="dot" id="liveDot"></span><span id="liveStatusText">載入 OCR 模組中...</span></span>
      <span id="scanRate">耗時: -- ms</span>
    </div>

    <div class="detected-row">
      <div>手牌: <b id="uiHand">-- --</b></div>
      <div>公共牌: <b id="uiBoard">--</b></div>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="22.2" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="7.4" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>對手人數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="recalc()">
      </div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">即時勝率 (Win Rate)</div>
        <div class="odds-val" id="uiWin" style="color:#94a3b8;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="action-btn act-waiting">請對準 iPhone 牌面...</div>
  </div>

  <script>
    const video = document.getElementById('v');
    const liveDot = document.getElementById('liveDot');
    const liveStatusText = document.getElementById('liveStatusText');
    const scanRateText = document.getElementById('scanRate');

    const cHand = document.getElementById('c-hand');
    const ctxHand = cHand.getContext('2d', { willReadFrequently: true });
    const cBoard = document.getElementById('c-board');
    const ctxBoard = cBoard.getContext('2d', { willReadFrequently: true });

    let ocrWorker = null;
    let isProcessing = false;
    let currentCards = { my: [], board: [] };

    async function initOCR() {
      try {
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({
          tessedit_char_whitelist: 'AKQJ1098765432akqj',
          tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
        });
        liveStatusText.innerText = "OCR 準備完成";
        startLoop();
      } catch (e) {
        liveStatusText.innerText = "OCR 錯誤: " + e.message;
      }
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    }).then(s => {
      video.srcObject = s;
      video.onloadedmetadata = () => {
        liveDot.classList.add('live');
        initOCR();
      };
    }).catch(err => liveStatusText.innerText = "相機啟動失敗: " + err.message);

    function startLoop() {
      setInterval(async () => {
        if (isProcessing || !ocrWorker || !video.videoWidth) return;
        isProcessing = true;
        const t0 = performance.now();
        await scanCards();
        const t1 = performance.now();
        scanRateText.innerText = `耗時: ${(t1 - t0).toFixed(0)} ms`;
        isProcessing = false;
      }, 1000);
    }

    // 裁切並黑白化
    function cropAndFilter(rx, ry, rw, rh, targetCanvas, targetCtx) {
      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const sx = Math.floor(rx * vw);
      const sy = Math.floor(ry * vh);
      const sw = Math.floor(rw * vw);
      const sh = Math.floor(rh * vh);

      targetCanvas.width = sw;
      targetCanvas.height = sh;
      targetCtx.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);

      const imgData = targetCtx.getImageData(0, 0, sw, sh);
      const d = imgData.data;

      // 自適應灰階閥值，突顯撲克牌白底上的文字
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        const brightness = (r + g + b) / 3;
        const diff = Math.max(r, g, b) - Math.min(r, g, b);

        // 如果是白底撲克牌背景
        if (brightness > 130 && diff < 50) {
          d[i] = 255; d[i+1] = 255; d[i+2] = 255; // 變純白
        } else {
          d[i] = 0; d[i+1] = 0; d[i+2] = 0; // 字體/花色變純黑
        }
      }
      targetCtx.putImageData(imgData, 0, 0);
      return targetCanvas.toDataURL('image/png');
    }

    async function scanCards() {
      try {
        // 1. 掃描手牌 (精準對位至右下方手牌區)
        const handDataUrl = cropAndFilter(0.45, 0.74, 0.28, 0.14, cHand, ctxHand);
        const handRes = await ocrWorker.recognize(handDataUrl);
        const handText = handRes.data.text.replace(/[^AKQJ0-9]/gi, '').toUpperCase();
        const handRanks = parsePokerRanks(handText);

        // 2. 掃描公共牌 (精準對位至中央 5 張牌)
        const boardDataUrl = cropAndFilter(0.24, 0.37, 0.52, 0.12, cBoard, ctxBoard);
        const boardRes = await ocrWorker.recognize(boardDataUrl);
        const boardText = boardRes.data.text.replace(/[^AKQJ0-9]/gi, '').toUpperCase();
        const boardRanks = parsePokerRanks(boardText);

        if (handRanks.length >= 2) {
          currentCards.my = [handRanks[0] + "♥", handRanks[1] + "♦"];
        } else if (handRanks.length === 1) {
          currentCards.my = [handRanks[0] + "♥", "--"];
        } else {
          currentCards.my = [];
        }

        currentCards.board = boardRanks.map(r => r + "♠");
        updateUI();
      } catch (e) {
        console.warn(e);
      }
    }

    function parsePokerRanks(str) {
      const res = [];
      let i = 0;
      while (i < str.length) {
        if (str.substr(i, 2) === "10") {
          res.push("10");
          i += 2;
        } else if ("AKQJ98765432".includes(str[i])) {
          res.push(str[i]);
          i++;
        } else {
          i++;
        }
      }
      return res;
    }

    function updateUI() {
      document.getElementById('uiHand').innerText = currentCards.my.length > 0 ? currentCards.my.join(' ') : "-- --";
      document.getElementById('uiBoard').innerText = currentCards.board.length > 0 ? currentCards.board.join(' ') : "--";
      recalc();
    }

    function recalc() {
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const opp = parseInt(document.getElementById('inpOpp').value) || 3;

      let potOdds = 0;
      if (pot + call > 0 && call > 0) potOdds = call / (pot + call);
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const uiWin = document.getElementById('uiWin');
      const btn = document.getElementById('uiAction');

      if (currentCards.my.length < 2 || currentCards.my.includes("--")) {
        uiWin.innerText = "--%";
        btn.className = "action-btn act-waiting";
        btn.innerText = "請將手牌框對準右下角 2 張牌...";
        return;
      }

      let winRate = 0.06;
      const ranks = currentCards.my.map(c => c.slice(0, -1));
      if (ranks.includes('A')) winRate += 0.20;
      if (ranks.includes('K')) winRate += 0.15;
      if (ranks[0] === ranks[1]) winRate += 0.28;

      winRate = Math.max(0.04, winRate / (opp * 0.45));
      uiWin.innerText = (winRate * 100).toFixed(1) + "%";
      uiWin.style.color = winRate > potOdds ? "#4ade80" : "#f87171";

      if (call === 0) {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：過牌 (CHECK)";
      } else if (winRate < potOdds) {
        btn.className = "action-btn act-fold";
        btn.innerText = `建議：棄牌 (FOLD)`;
      } else if (winRate > potOdds + 0.18) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE)";
      } else {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：跟注 (CALL)";
      }
    }
  </script>
</body>
</html>
