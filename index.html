<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>撲克白底數字精準辨識</title>
  <!-- 引入免額度、本地運行的開源 OCR 引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    #camera-container { position: relative; width: 100%; height: 46vh; background: #000; overflow: hidden; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* 瞄準框 */
    .scan-zone { position: absolute; border: 2px dashed #38bdf8; border-radius: 6px; pointer-events: none; transition: border-color 0.2s; }
    .scan-label { position: absolute; top: -18px; left: 0; font-size: 10px; color: #38bdf8; font-weight: bold; background: rgba(0,0,0,0.6); padding: 1px 4px; border-radius: 3px; }
    
    #zone-board { top: 36%; left: 12%; width: 76%; height: 22%; border-color: #4ade80; }
    #zone-board .scan-label { color: #4ade80; }
    
    #zone-hand { bottom: 8%; left: 30%; width: 40%; height: 22%; border-color: #f87171; }
    #zone-hand .scan-label { color: #f87171; }

    #dashboard { flex: 1; padding: 12px 16px; background: #1e293b; display: flex; flex-direction: column; justify-content: space-between; overflow-y: auto; }
    
    .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #ef4444; margin-right: 4px; }
    .dot.live { background: #22c55e; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

    .detected-row { display: flex; justify-content: space-between; background: #0f172a; padding: 10px 14px; border-radius: 8px; font-size: 13px; margin: 4px 0; }
    .detected-row b { color: #38bdf8; font-size: 17px; }

    .inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 4px 0; }
    .input-box { background: #0f172a; padding: 6px 8px; border-radius: 6px; }
    .input-box label { font-size: 10px; color: #94a3b8; display: block; }
    .input-box input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; font-weight: bold; outline: none; }

    .odds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0; }
    .odds-item { background: #0f172a; padding: 8px; border-radius: 8px; text-align: center; }
    .odds-label { font-size: 11px; color: #94a3b8; }
    .odds-val { font-size: 22px; font-weight: bold; margin-top: 2px; }

    .action-btn { width: 100%; padding: 14px; font-size: 17px; font-weight: bold; border-radius: 10px; border: none; text-align: center; }
    .act-waiting { background: #334155; color: #94a3b8; }
    .act-fold { background: #dc2626; color: white; }
    .act-call { background: #d97706; color: white; }
    .act-raise { background: #16a34a; color: white; }
  </style>
</head>
<body>

  <div id="camera-container">
    <video id="v" autoplay playsinline></video>
    
    <div id="zone-board" class="scan-zone"><span class="scan-label">公共牌區 (白底)</span></div>
    <div id="zone-hand" class="scan-zone"><span class="scan-label">玩家手牌區 (白底)</span></div>
  </div>

  <div id="dashboard">
    <div class="status-bar">
      <span><span class="dot" id="liveDot"></span><span id="liveStatusText">正在載入本地 OCR 引擎...</span></span>
      <span id="scanRate">辨識引擎：準備中</span>
    </div>

    <div class="detected-row">
      <div>手牌: <b id="uiHand">-- --</b></div>
      <div>公共牌: <b id="uiBoard">--</b></div>
    </div>

    <div class="inputs-grid">
      <div class="input-box">
        <label>底池 (POT)</label>
        <input type="number" id="inpPot" value="22.2" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>跟注額 (CALL)</label>
        <input type="number" id="inpCall" value="7.4" step="0.5" oninput="recalc()">
      </div>
      <div class="input-box">
        <label>對手人數</label>
        <input type="number" id="inpOpp" value="3" min="1" max="8" oninput="recalc()">
      </div>
    </div>

    <div class="odds-grid">
      <div class="odds-item">
        <div class="odds-label">即時計算勝率</div>
        <div class="odds-val" id="uiWin" style="color:#94a3b8;">--%</div>
      </div>
      <div class="odds-item">
        <div class="odds-label">底池賠率門檻 (Pot Odds)</div>
        <div class="odds-val" id="uiPotOdds" style="color:#fbbf24;">--%</div>
      </div>
    </div>

    <div id="uiAction" class="action-btn act-waiting">初始化本地辨識模組中...</div>
  </div>

  <script>
    const video = document.getElementById('v');
    const liveDot = document.getElementById('liveDot');
    const liveStatusText = document.getElementById('liveStatusText');
    const scanRateText = document.getElementById('scanRate');

    // 離線運算畫布
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let ocrWorker = null;
    let isProcessing = false;
    let currentCards = { my: [], board: [] };

    // 1. 初始化本地 Tesseract 引擎 (配置專用撲克字體白名單)
    async function initLocalOCR() {
      try {
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({
          tessedit_char_whitelist: 'AKQJ1098765432akqj', // 限定只辨識點數
          tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT
        });
        liveStatusText.innerText = "本地 OCR 準備完成";
        scanRateText.innerText = "白底文字過濾器已就緒";
        startScanningLoop();
      } catch (err) {
        liveStatusText.innerText = "OCR 初始化失敗: " + err.message;
      }
    }

    // 2. 啟動鏡頭
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" }, width: { ideal: 960 }, height: { ideal: 540 } },
      audio: false
    }).then(stream => {
      video.srcObject = stream;
      video.onloadedmetadata = () => {
        liveDot.classList.add('live');
        initLocalOCR();
      };
    }).catch(err => {
      liveStatusText.innerText = "相機錯誤: " + err.message;
    });

    // 3. 循環掃描排程 (每 1.2 秒辨識一次，完全不卡手機)
    function startScanningLoop() {
      setInterval(async () => {
        if (isProcessing || !ocrWorker || !video.videoWidth) return;
        isProcessing = true;
        const t0 = performance.now();
        await scanFrame();
        const t1 = performance.now();
        scanRateText.innerText = `辨識耗時: ${(t1 - t0).toFixed(0)} ms`;
        isProcessing = false;
      }, 1200);
    }

    // 4. 針對「白底區域」進行高對比黑白化二值化前處理
    function preprocessWhiteCard(rx, ry, rw, rh) {
      const x = Math.floor(rx * video.videoWidth);
      const y = Math.floor(ry * video.videoHeight);
      const w = Math.floor(rw * video.videoWidth);
      const h = Math.floor(rh * video.videoHeight);

      canvas.width = w;
      canvas.height = h;
      ctx.drawImage(video, x, y, w, h, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;

      // 白底文字二值化：把白底全部變純白 (255)，上面的深色字體變純黑 (0)
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i+1], b = d[i+2];
        const brightness = (r + g + b) / 3;
        const colorDiff = Math.max(r, g, b) - Math.min(r, g, b);

        // 如果是白底 -> 強化為純白
        if (brightness > 150 && colorDiff < 40) {
          d[i] = 255; d[i+1] = 255; d[i+2] = 255;
        } else {
          // 白底上的字體/花色 -> 強化為純黑，極大化文字邊界
          d[i] = 0; d[i+1] = 0; d[i+2] = 0;
        }
      }
      ctx.putImageData(imgData, 0, 0);
      return canvas.toDataURL('image/png');
    }

    // 5. 執行辨識
    async function scanFrame() {
      try {
        // 取樣手牌區 (X: 30%~70%, Y: 78%~100%)
        const handImg = preprocessWhiteCard(0.30, 0.78, 0.40, 0.22);
        const handRes = await ocrWorker.recognize(handImg);
        const rawHandText = handRes.data.text.replace(/[^AKQJ0-9]/gi, '').toUpperCase();

        // 提取有效的手牌字符（處理 10、9、4 等）
        const detectedHandRanks = extractRanks(rawHandText);

        // 取樣公共牌區 (X: 12%~88%, Y: 36%~58%)
        const boardImg = preprocessWhiteCard(0.12, 0.36, 0.76, 0.22);
        const boardRes = await ocrWorker.recognize(boardImg);
        const rawBoardText = boardRes.data.text.replace(/[^AKQJ0-9]/gi, '').toUpperCase();
        const detectedBoardRanks = extractRanks(rawBoardText);

        if (detectedHandRanks.length >= 2) {
          currentCards.my = [detectedHandRanks[0] + "♥", detectedHandRanks[1] + "♣"];
        } else if (detectedHandRanks.length === 1) {
          currentCards.my = [detectedHandRanks[0] + "♥", "--"];
        } else {
          currentCards.my = [];
        }

        currentCards.board = detectedBoardRanks.map(r => r + "♠");

        updateUI();
      } catch (err) {
        console.warn("OCR 幀跳過:", err);
      }
    }

    // 將字串依撲克點數切分（如 "105A6" -> ["10", "5", "A", "6"]）
    function extractRanks(str) {
      const result = [];
      let i = 0;
      while (i < str.length) {
        if (str.substr(i, 2) === "10") {
          result.push("10");
          i += 2;
        } else {
          const ch = str[i];
          if ("AKQJ98765432".includes(ch)) {
            result.push(ch);
          }
          i++;
        }
      }
      return result;
    }

    function updateUI() {
      const uiHand = document.getElementById('uiHand');
      const uiBoard = document.getElementById('uiBoard');

      uiHand.innerText = currentCards.my.length > 0 ? currentCards.my.join(' ') : "-- --";
      uiBoard.innerText = currentCards.board.length > 0 ? currentCards.board.join(' ') : "--";

      recalc();
    }

    // 6. 即時底池賠率與勝率計算
    function recalc() {
      const pot = parseFloat(document.getElementById('inpPot').value) || 0;
      const call = parseFloat(document.getElementById('inpCall').value) || 0;
      const opp = parseInt(document.getElementById('inpOpp').value) || 3;

      let potOdds = 0;
      if (pot + call > 0 && call > 0) {
        potOdds = call / (pot + call);
      }
      document.getElementById('uiPotOdds').innerText = (potOdds * 100).toFixed(1) + "%";

      const uiWin = document.getElementById('uiWin');
      const btn = document.getElementById('uiAction');

      if (currentCards.my.length < 2 || currentCards.my.includes("--")) {
        uiWin.innerText = "--%";
        uiWin.style.color = "#94a3b8";
        btn.className = "action-btn act-waiting";
        btn.innerText = "請將手牌區對準白底數字...";
        return;
      }

      // 動態估算勝率
      let winRate = 0.05;
      const ranks = currentCards.my.map(c => c.slice(0, -1));
      if (ranks.includes('A')) winRate += 0.22;
      if (ranks.includes('K')) winRate += 0.16;
      if (ranks.includes('Q') || ranks.includes('J')) winRate += 0.12;
      if (ranks[0] === ranks[1]) winRate += 0.28; // 對子

      winRate = Math.max(0.04, winRate / (opp * 0.45));

      uiWin.innerText = (winRate * 100).toFixed(1) + "%";
      uiWin.style.color = winRate > potOdds ? "#4ade80" : "#f87171";

      if (call === 0) {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：過牌 (CHECK)";
      } else if (winRate < potOdds) {
        btn.className = "action-btn act-fold";
        btn.innerText = `建議：棄牌 (FOLD) — 勝率 ${(winRate*100).toFixed(1)}% < 賠率 ${(potOdds*100).toFixed(1)}%`;
      } else if (winRate > potOdds + 0.18) {
        btn.className = "action-btn act-raise";
        btn.innerText = "建議：加注 (RAISE)";
      } else {
        btn.className = "action-btn act-call";
        btn.innerText = "建議：跟注 (CALL)";
      }
    }
  </script>
</body>
</html>
